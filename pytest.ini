[pytest]
; Directorio y patrón global de descubrimiento de pruebas
testpaths = tests
python_files = test_*.py

; Opciones por defecto: cobertura del paquete app en cada ejecución
addopts =
    --cov=app
    --cov-report=term-missing

; Registro de markers / categorías de la suite de pruebas
markers =
    unit: Pruebas unitarias de endpoints y reglas de negocio.
    e2e: Pruebas de extremo a extremo con flujo CRUD continuo e integrado.
    ui: Pruebas de interfaz de usuario con navegador real usando Playwright.